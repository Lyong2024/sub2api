name: DIY Release

# 每次推送到 diy 分支或打 diy-v* tag 时，自动构建多平台单二进制（内嵌前端 + SQLite DIY）。
# 压缩包命名：sub2api-YYMMDD-{goos}-{goarch}.tar.gz|zip
# 例：sub2api-260728-linux-amd64.tar.gz
on:
  push:
    branches:
      - diy
    tags:
      - 'diy-v*'
  workflow_dispatch:
    inputs:
      version:
        description: '可选版本号；留空则用构建日 UTC 日期 YYMMDD（如 260728）'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install & build frontend
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Upload frontend dist
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: backend/internal/web/dist/
          retention-days: 3

  build-binaries:
    needs: build-frontend
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            ext: ''
          - goos: linux
            goarch: arm64
            ext: ''
          - goos: windows
            goarch: amd64
            ext: '.exe'
          - goos: darwin
            goarch: amd64
            ext: ''
          - goos: darwin
            goarch: arm64
            ext: ''
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download frontend dist
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: backend/internal/web/dist/

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Resolve version (YYMMDD by default)
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          # 构建日版本：UTC 日期，例 2026-07-28 → 260728
          DATE_VER="$(date -u +%y%m%d)"
          INPUT_VER="${{ github.event.inputs.version }}"

          if [[ "${{ github.ref }}" == refs/tags/diy-v* ]]; then
            # tag diy-v1.2.3 → 优先用 tag 中版本段；若只想用日期也可改成 DATE_VER
            TAG="${GITHUB_REF#refs/tags/}"
            V="${TAG#diy-v}"
            V="${V#v}"
            if [[ -z "$V" ]]; then
              V="$DATE_VER"
            fi
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${INPUT_VER// }" ]]; then
            V="${INPUT_VER// /}"
          else
            V="$DATE_VER"
          fi

          # 包名片段仅允许安全字符
          V="$(echo "$V" | tr -c 'A-Za-z0-9._-' '-' | sed 's/-\+/-/g; s/^-//; s/-$//')"
          if [[ -z "$V" ]]; then
            V="$DATE_VER"
          fi

          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "date=$DATE_VER" >> "$GITHUB_OUTPUT"
          echo "commit=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"
          echo "Resolved package version: $V (date=$DATE_VER commit=${GITHUB_SHA::8})"

      - name: Build
        working-directory: backend
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          mkdir -p ../dist
          # 二进制：sub2api-260728-linux-amd64[.exe]
          OUT="sub2api-${{ steps.ver.outputs.version }}-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}"
          go build -tags embed \
            -ldflags="-s -w -X main.Version=${{ steps.ver.outputs.version }} -X main.Commit=${{ steps.ver.outputs.commit }} -X main.BuildType=release" \
            -o "../dist/${OUT}" \
            ./cmd/server
          echo "BINARY=${OUT}" >> "$GITHUB_ENV"
          echo "PKG_BASE=sub2api-${{ steps.ver.outputs.version }}-${{ matrix.goos }}-${{ matrix.goarch }}" >> "$GITHUB_ENV"

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p package
          cp "dist/${BINARY}" "package/sub2api${{ matrix.ext }}"
          # Ship examples only — do NOT pre-install config.yaml/.installed or AutoSetup is skipped
          # and the users table stays empty (Windows login footgun).
          cp deploy/diy/config.example.yaml package/config.example.yaml
          cp deploy/diy/.env.example package/.env.example
          cp deploy/diy/start.bat package/start.bat 2>/dev/null || true
          cp deploy/diy/sub2api.service package/ 2>/dev/null || true
          cp deploy/diy/install-systemd.sh package/ 2>/dev/null || true
          cp README_DIY.md package/ 2>/dev/null || true
          cp README_DIY_CN.md package/ 2>/dev/null || true
          if [[ "${{ matrix.goos }}" == "windows" ]]; then
            cp deploy/diy/start.bat package/start.bat
            # Normalize CRLF for cmd.exe
            sed -i 's/$/\r/' package/start.bat 2>/dev/null || true
          fi
          cd package
          if [[ "${{ matrix.goos }}" == "windows" ]]; then
            # sub2api-260728-windows-amd64.zip
            zip -r "../dist/${PKG_BASE}.zip" .
          else
            # sub2api-260728-linux-amd64.tar.gz
            tar -czf "../dist/${PKG_BASE}.tar.gz" .
          fi
          ls -la ../dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: sub2api-${{ steps.ver.outputs.version }}-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          retention-days: 30

  # Always publish to GitHub Releases so binaries appear under /releases.
  # - push diy / workflow_dispatch → rolling prerelease tag diy-latest
  # - tag diy-v* → versioned release (non-prerelease)
  #
  # Requires repo setting:
  #   Settings → Actions → General → Workflow permissions → Read and write
  # (API: default_workflow_permissions=write). Read-only GITHUB_TOKEN causes 403.
  release:
    needs: build-binaries
    runs-on: ubuntu-latest
    # Job-level write is required even when workflow default is restricted.
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: sub2api-*
          merge-multiple: true

      - name: Prepare release meta
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          shopt -s nullglob
          # download-artifact may nest by artifact name
          while IFS= read -r -d '' f; do
            case "$(basename "$f")" in
              *.tar.gz|*.zip) cp "$f" release-assets/ ;;
            esac
          done < <(find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' \) -print0)

          echo "Release assets:"
          ls -la release-assets/
          count=$(find release-assets -type f | wc -l | tr -d ' ')
          if [[ "$count" -lt 1 ]]; then
            echo "No package files found under artifacts/"
            find artifacts -type f || true
            exit 1
          fi

          # 从包名推断版本：sub2api-260728-linux-amd64.tar.gz → 260728
          SAMPLE=$(ls release-assets/sub2api-*-linux-amd64.tar.gz release-assets/sub2api-*.tar.gz 2>/dev/null | head -1 || true)
          PKG_VER=""
          if [[ -n "$SAMPLE" ]]; then
            base=$(basename "$SAMPLE")
            PKG_VER=$(echo "$base" | sed -E 's/^sub2api-//; s/-(linux|windows|darwin)-.*$//')
          fi
          if [[ -z "$PKG_VER" ]]; then
            PKG_VER="$(date -u +%y%m%d)"
          fi

          if [[ "${{ github.ref }}" == refs/tags/diy-v* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
            echo "name=DIY ${GITHUB_REF#refs/tags/} (${PKG_VER})" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "tag=diy-latest" >> "$GITHUB_OUTPUT"
            echo "name=DIY ${PKG_VER}" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi
          echo "pkg_ver=$PKG_VER" >> "$GITHUB_OUTPUT"
          echo "commit=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "short=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release (gh cli)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
          RELEASE_NAME: ${{ steps.meta.outputs.name }}
          RELEASE_COMMIT: ${{ steps.meta.outputs.commit }}
          RELEASE_SHORT: ${{ steps.meta.outputs.short }}
          PKG_VER: ${{ steps.meta.outputs.pkg_ver }}
          IS_PRERELEASE: ${{ steps.meta.outputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"

          # Prove token can write; fail with actionable message if repo still read-only.
          if ! gh api "repos/${REPO}" --jq .permissions.push >/dev/null 2>&1; then
            echo "::error::Cannot query repo with GITHUB_TOKEN"
            exit 1
          fi

          NOTES_FILE="$(mktemp)"
          cat > "$NOTES_FILE" <<EOF
          Sub2API **DIY** 单二进制发布（SQLite WAL + 嵌入式 Redis + 内嵌 Web UI）。

          - **版本（包名）**: \`${PKG_VER}\`（构建日 UTC \`YYMMDD\`）
          - **Commit**: \`${RELEASE_SHORT}\`
          - **Tag**: \`${RELEASE_TAG}\`
          - 仅需暴露 **8080**

          详见 \`README_DIY.md\` / \`README_DIY_CN.md\`。

          \`\`\`bash
          export DEPLOY_MODE=diy
          ./sub2api
          \`\`\`

          ### 下载文件命名

          \`\`\`
          sub2api-${PKG_VER}-linux-amd64.tar.gz
          sub2api-${PKG_VER}-linux-arm64.tar.gz
          sub2api-${PKG_VER}-windows-amd64.zip
          sub2api-${PKG_VER}-darwin-amd64.tar.gz
          sub2api-${PKG_VER}-darwin-arm64.tar.gz
          \`\`\`
          EOF
          # strip accidental leading spaces from heredoc lines
          sed -i 's/^          //' "$NOTES_FILE"

          # Rolling tag: delete previous release+tag so asset names stay clean.
          if [[ "$RELEASE_TAG" == "diy-latest" ]]; then
            gh release delete "$RELEASE_TAG" --repo "$REPO" --yes --cleanup-tag 2>/dev/null || true
          fi

          CREATE_ARGS=(
            release create "$RELEASE_TAG"
            --repo "$REPO"
            --target "$RELEASE_COMMIT"
            --title "$RELEASE_NAME"
            --notes-file "$NOTES_FILE"
          )
          if [[ "$IS_PRERELEASE" == "true" ]]; then
            CREATE_ARGS+=(--prerelease)
          fi

          shopt -s nullglob
          ASSETS=(release-assets/*)
          if [[ ${#ASSETS[@]} -lt 1 ]]; then
            echo "::error::No assets to upload"
            exit 1
          fi
          CREATE_ARGS+=("${ASSETS[@]}")

          echo "Creating release: tag=$RELEASE_TAG title=$RELEASE_NAME assets=${#ASSETS[@]}"
          set +e
          OUT="$(gh "${CREATE_ARGS[@]}" 2>&1)"
          RC=$?
          set -e
          echo "$OUT"
          if [[ $RC -ne 0 ]]; then
            if echo "$OUT" | grep -qiE 'Resource not accessible|403|HTTP 403'; then
              echo "::error::GITHUB_TOKEN lacks permission to create releases (403)."
              echo "::error::Fix: Repo Settings → Actions → General → Workflow permissions → 'Read and write permissions', then re-run."
              echo "::error::Or set a PAT secret RELEASE_TOKEN with 'contents: write' and use it as GH_TOKEN."
            fi
            exit $RC
          fi
          echo "Release published: https://github.com/${REPO}/releases/tag/${RELEASE_TAG}"
